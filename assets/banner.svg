<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 350" width="100%" height="350">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGradients" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06101E"/>
      <stop offset="50%" stop-color="#0B2545"/>
      <stop offset="100%" stop-color="#134074"/>
    </linearGradient>

    <!-- Accent Glow Gradients -->
    <linearGradient id="cyanGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F2FE"/>
      <stop offset="100%" stop-color="#4FACFE"/>
    </linearGradient>

    <radialGradient id="radarPulse" cx="85%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00F2FE" stop-opacity="0.25"/>
      <stop offset="50%" stop-color="#00D4FF" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#0B2545" stop-opacity="0"/>
    </radialGradient>

    <!-- Linear Overlay pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#FFFFFF" stroke-opacity="0.03" stroke-width="1"/>
    </pattern>

    <!-- Filter for crisp shadow -->
    <filter id="textGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComponentTransfer in="blur" result="glow">
        <feFuncA type="linear" slope="0.5"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode in="glow" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Base Canvas -->
  <rect width="1200" height="350" fill="url(#bgGradients)" rx="12"/>
  <rect width="1200" height="350" fill="url(#grid)" rx="12"/>
  <rect width="1200" height="350" fill="url(#radarPulse)" rx="12"/>

  <!-- Dynamic Tech / Maritime Graphic Accents in Background -->
  <!-- Wave / Radar Lines (Background) -->
  <g opacity="0.3">
    <circle cx="1020" cy="175" r="140" fill="none" stroke="#00F2FE" stroke-width="1.5" stroke-dasharray="8 6"/>
    <circle cx="1020" cy="175" r="100" fill="none" stroke="#4FACFE" stroke-width="1"/>
    <circle cx="1020" cy="175" r="60" fill="none" stroke="#00F2FE" stroke-width="1.5"/>
    <circle cx="1020" cy="175" r="8" fill="#00F2FE"/>

    <!-- Radar Line Sweep -->
    <line x1="1020" y1="175" x2="1140" y2="105" stroke="url(#cyanGlow)" stroke-width="2">
      <animateTransform attributeName="transform" type="rotate" from="0 1020 175" to="360 1020 175" dur="12s" repeatCount="indefinite"/>
    </line>

    <!-- Connecting Supply Chain Nodes -->
    <path d="M 750 260 L 840 220 L 930 250 L 1020 175 L 1100 210" fill="none" stroke="#00D4FF" stroke-width="1.5" stroke-dasharray="4 4"/>
    <circle cx="750" cy="260" r="5" fill="#00F2FE"/>
    <circle cx="840" cy="220" r="4" fill="#4FACFE"/>
    <circle cx="930" cy="250" r="5" fill="#00F2FE"/>
    <circle cx="1100" cy="210" r="4" fill="#4FACFE"/>
  </g>

  <!-- Modern Ship Hull Silhouette Graphic (Right Side Background) -->
  <g transform="translate(850, 110)" opacity="0.25">
    <path d="M 20 90 L 170 90 L 220 50 L 190 50 L 170 30 L 70 30 L 50 50 L 0 50 Z" fill="none" stroke="#FFFFFF" stroke-width="2"/>
    <line x1="40" y1="30" x2="40" y2="10" stroke="#00F2FE" stroke-width="2"/>
    <line x1="140" y1="30" x2="140" y2="5" stroke="#00F2FE" stroke-width="2"/>
    <rect x="80" y="10" width="30" height="20" fill="none" stroke="#FFFFFF" stroke-width="1.5"/>
  </g>

  <!-- Dynamic Glowing Particle Rays -->
  <g opacity="0.4">
    <path d="M -50 300 Q 300 200 600 320 T 1250 280" fill="none" stroke="url(#cyanGlow)" stroke-width="2"/>
    <path d="M -50 320 Q 350 260 700 340 T 1250 300" fill="none" stroke="#4FACFE" stroke-width="1"/>
  </g>

  <!-- Foreground Content (100% Legible & Unobscured) -->
  <g transform="translate(60, 0)">
    <!-- Badge Pill -->
    <g transform="translate(0, 50)">
      <rect width="260" height="30" rx="15" fill="#00F2FE" fill-opacity="0.15" stroke="#00F2FE" stroke-opacity="0.4" stroke-width="1"/>
      <text x="130" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#00F2FE" text-anchor="middle" letter-spacing="1.5">MARITIME E-PROCUREMENT</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="145" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="900" fill="#FFFFFF" letter-spacing="-0.5" filter="url(#textGlow)">
      Awesome Marine Procurement
    </text>

    <!-- Cyan Accent Underline -->
    <rect x="0" y="165" width="180" height="4" rx="2" fill="url(#cyanGlow)"/>

    <!-- Subtitle -->
    <text x="0" y="210" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#E2E8F0" width="700">
      Curated List of SaaS Platforms, Open-Source Tools &amp; Fleet Purchasing Systems
    </text>

    <!-- Keywords Tagline -->
    <g transform="translate(0, 255)">
      <!-- Tag 1 -->
      <rect x="0" y="0" width="130" height="26" rx="6" fill="#1E293B" stroke="#334155" stroke-width="1"/>
      <text x="65" y="17" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#94A3B8" text-anchor="middle">⚓ Ship Chandlery</text>

      <!-- Tag 2 -->
      <rect x="140" y="0" width="140" height="26" rx="6" fill="#1E293B" stroke="#334155" stroke-width="1"/>
      <text x="210" y="17" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#94A3B8" text-anchor="middle">📦 Requisition to PO</text>

      <!-- Tag 3 -->
      <rect x="290" y="0" width="145" height="26" rx="6" fill="#1E293B" stroke="#334155" stroke-width="1"/>
      <text x="362" y="17" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#94A3B8" text-anchor="middle">🌐 Supplier Networks</text>

      <!-- Tag 4 -->
      <rect x="445" y="0" width="150" height="26" rx="6" fill="#1E293B" stroke="#334155" stroke-width="1"/>
      <text x="520" y="17" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#94A3B8" text-anchor="middle">📊 Fleet Management</text>
    </g>
  </g>
</svg>
